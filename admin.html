<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VACI Lions — Photo Admin</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #911414;
            color: #451212;
            min-height: 100vh;
            padding: 2rem 1rem 4rem;
        }
        .wrap {
            width: min(760px, 100%);
            margin: 0 auto;
        }
        h1 {
            color: #fff;
            text-align: center;
            margin-bottom: 0.25rem;
        }
        .sub {
            color: rgba(255,255,255,0.8);
            text-align: center;
            margin-bottom: 2rem;
        }
        .card {
            background: #fff;
            border-radius: 1.25rem;
            padding: 2rem;
            box-shadow: 0 14px 35px rgba(18,19,69,0.25);
        }
        #login-card input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 0.6rem;
            border: 1.5px solid rgba(18,19,69,0.15);
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        button {
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            border: 0;
            border-radius: 0.7rem;
            padding: 0.75rem 1.2rem;
            background: #8f3b3b;
            color: #fff;
        }
        button:hover { opacity: 0.9; }
        #app { display: none; }
        .group {
            margin-bottom: 2.25rem;
        }
        .group h2 {
            font-size: 1.1rem;
            border-bottom: 2px solid rgba(18,19,69,0.1);
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
        }
        .slot-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(18,19,69,0.06);
        }
        .slot-row:last-child { border-bottom: none; }
        .thumb {
            width: 64px;
            height: 64px;
            border-radius: 0.6rem;
            background: repeating-linear-gradient(135deg, #f3f3f8 0 8px, #e9e9f4 8px 16px);
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid rgba(18,19,69,0.1);
        }
        .slot-info { flex: 1; }
        .slot-info .label { font-weight: 700; font-size: 0.95rem; }
        .slot-info .status { font-size: 0.8rem; color: #6a6a8f; }
        .slot-row input[type="file"] { max-width: 160px; font-size: 0.8rem; }
        .msg {
            margin-top: 2rem;
            text-align: center;
            font-weight: 600;
            min-height: 1.5rem;
        }
        .msg.error { color: #b3261e; }
        .msg.ok { color: #1e7a2f; }
        .setup-warning {
            background: #fff4e5;
            border: 1px solid #f2b134;
            border-radius: 0.8rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>VACI Lions Photo Admin</h1>
        <p class="sub">Upload photos for the website</p>

        <div id="login-card" class="card">
            <input type="email" id="email-input" placeholder="Email" autocomplete="username">
            <input type="password" id="password-input" placeholder="Password" autocomplete="current-password">
            <button id="login-btn" type="button">Log in</button>
            <p id="login-error" class="msg error"></p>
        </div>

        <div id="app" class="card">
            <div id="setup-warning" class="setup-warning" style="display:none;">
                ⚠️ Cloudinary and/or Firebase haven't been configured yet in <code>firebase-config.js</code>. Uploads won't work until that's filled in.
            </div>

            <div class="group">
                <h2>Home Page</h2>
                <div id="slots-home"></div>
            </div>
            <div class="group">
                <h2>What We Do</h2>
                <div id="slots-whatwedo"></div>
            </div>
            <div class="group">
                <h2>Upcoming Events</h2>
                <div id="slots-upcoming"></div>
            </div>
            <div class="group">
                <h2>Past Events</h2>
                <div id="slots-past"></div>
            </div>
            <div class="group">
                <h2>Leaders &amp; Members</h2>
                <div id="slots-roster"></div>
            </div>

            <p id="status-msg" class="msg"></p>
            <div style="text-align:center; margin-top: 1rem;">
                <button id="logout-btn" type="button" style="background: transparent; color: #6a6a8f; font-weight: 600;">Log out</button>
            </div>
        </div>
    </div>

    <script>
        const SLOTS = [
            { key: 'hero-photo',    label: 'Circle 1x1: Featured photo',       group: 'slots-home' },
            { key: 'gallery-1',     label: '4x3: Recent photo 1',              group: 'slots-home' },
            { key: 'gallery-2',     label: '4x3: Recent photo 2',              group: 'slots-home' },
            { key: 'gallery-3',     label: '4x3: Recent photo 3',              group: 'slots-home' },
            { key: 'gallery-4',     label: '4x3: Recent photo 4',              group: 'slots-home' },
            { key: 'performance-video', label: '16x9: Behind the Dance video', group: 'slots-whatwedo', type: 'video' },
            { key: 'flyer',         label: '9x16: Flyer',                      group: 'slots-upcoming' },
            { key: 'past-event-1',  label: '4x3: Photo 1',                     group: 'slots-past' },
            { key: 'past-event-2',  label: '4x3: Photo 2',                     group: 'slots-past' },
            { key: 'past-event-3',  label: '4x3: Photo 3',                     group: 'slots-past' },
            { key: 'leader-andy',   label: 'Circle 1x1: Andy Ta',              group: 'slots-roster' },
            { key: 'leader-jordyn', label: 'Circle 1x1: Jordyn Cherniss',      group: 'slots-roster' },
            { key: 'leader-tosh',   label: 'Circle 1x1: Tosh Cherniss',        group: 'slots-roster' },
            { key: 'leader-sarah',  label: 'Circle 1x1: Sarah Bui',            group: 'slots-roster' },
        ];

        const loginCard = document.getElementById('login-card');
        const app = document.getElementById('app');
        const statusMsg = document.getElementById('status-msg');

        let db = null;
        let auth = null;
        let currentImages = {};
        let slotsRendered = false;

        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        auth = firebase.auth();

        document.getElementById('login-btn').addEventListener('click', tryLogin);
        document.getElementById('password-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') tryLogin();
        });
        document.getElementById('logout-btn').addEventListener('click', () => auth.signOut());

        function tryLogin() {
            const email = document.getElementById('email-input').value.trim();
            const pw = document.getElementById('password-input').value;
            document.getElementById('login-error').textContent = '';
            auth.signInWithEmailAndPassword(email, pw).catch((err) => {
                document.getElementById('login-error').textContent = 'Login failed: ' + err.message;
            });
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                loginCard.style.display = 'none';
                app.style.display = 'block';
                initAdmin();
            } else {
                loginCard.style.display = 'block';
                app.style.display = 'none';
            }
        });

        function initAdmin() {
            const notConfigured =
                cloudinaryConfig.cloudName.startsWith('PASTE_') ||
                cloudinaryConfig.uploadPreset.startsWith('PASTE_');
            document.getElementById('setup-warning').style.display = notConfigured ? 'block' : 'none';

            if (!slotsRendered) {
                renderSlots();
                slotsRendered = true;
            }

            db.collection('site').doc('images').get().then((doc) => {
                currentImages = doc.exists ? (doc.data() || {}) : {};
                SLOTS.forEach((slot) => updateThumb(slot.key));
            }).catch((err) => console.warn('Could not load current images:', err));
        }

        function renderSlots() {
            SLOTS.forEach((slot) => {
                const isVideo = slot.type === 'video';
                const row = document.createElement('div');
                row.className = 'slot-row';
                row.innerHTML = `
                    ${isVideo
                        ? `<video class="thumb" id="thumb-${slot.key}" muted playsinline></video>`
                        : `<img class="thumb" id="thumb-${slot.key}" src="" alt="">`}
                    <div class="slot-info">
                        <div class="label">${slot.label}</div>
                        <div class="status" id="status-${slot.key}">${isVideo ? 'No video yet' : 'No photo yet'}</div>
                    </div>
                    <input type="file" accept="${isVideo ? 'video/*' : 'image/*'}" id="file-${slot.key}">
                `;
                document.getElementById(slot.group).appendChild(row);
                document.getElementById(`file-${slot.key}`).addEventListener('change', (e) => {
                    if (e.target.files && e.target.files[0]) {
                        uploadPhoto(slot.key, e.target.files[0], isVideo);
                    }
                });
            });
        }

        function updateThumb(key) {
            const slot = SLOTS.find((s) => s.key === key);
            const isVideo = slot && slot.type === 'video';
            const thumbEl = document.getElementById(`thumb-${key}`);
            const statusEl = document.getElementById(`status-${key}`);
            const url = currentImages[key];
            if (url) {
                thumbEl.src = url;
                statusEl.textContent = isVideo ? 'Current video set' : 'Current photo set';
            } else {
                thumbEl.removeAttribute('src');
                statusEl.textContent = isVideo ? 'No video yet' : 'No photo yet';
            }
        }

        async function uploadPhoto(key, file, isVideo) {
            statusMsg.textContent = 'Uploading…';
            statusMsg.className = 'msg';
            document.getElementById(`status-${key}`).textContent = 'Uploading…';

            try {
                const url = await uploadToCloudinary(file, isVideo);
                if (db) {
                    await db.collection('site').doc('images').set({ [key]: url }, { merge: true });
                }
                currentImages[key] = url;
                updateThumb(key);
                statusMsg.textContent = isVideo
                    ? 'Uploaded! The website will show this video the next time it loads.'
                    : 'Uploaded! The website will show this photo the next time it loads.';
                statusMsg.className = 'msg ok';
            } catch (err) {
                console.error(err);
                statusMsg.textContent = 'Upload failed — check the setup in firebase-config.js.';
                statusMsg.className = 'msg error';
                document.getElementById(`status-${key}`).textContent = 'Upload failed';
            }
        }

        function uploadToCloudinary(file, isVideo) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', cloudinaryConfig.uploadPreset);
            const resourceType = isVideo ? 'video' : 'image';
            return fetch(`https://api.cloudinary.com/v1_1/${cloudinaryConfig.cloudName}/${resourceType}/upload`, {
                method: 'POST',
                body: formData,
            })
            .then((res) => {
                if (!res.ok) throw new Error('Cloudinary upload failed');
                return res.json();
            })
            .then((data) => data.secure_url);
        }
    </script>
</body>
</html>
